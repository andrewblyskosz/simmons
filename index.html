<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Spell Master — Choose Your Player</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;overflow-y:auto;
  background:#07071A url('D:/AI CREATED APPS AND SITE BY ANDREW/WORD SPELL/IVY WORD SPELL/ASSETS/for web/IVY-WORD-SPELL_PORTRAIT.jpg') center top / cover no-repeat fixed;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Nunito',sans-serif;padding:30px 20px;
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;
  max-width:900px;width:100%;margin-top:160px;}
.player-card{position:relative;border-radius:18px;overflow:hidden;
  aspect-ratio:3/2;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  text-decoration:none;}
.player-card:hover{transform:translateY(-6px) scale(1.02);}
.card-bg{position:absolute;inset:0;background-size:cover;
  background-position:center;transition:transform .4s;}
.player-card:hover .card-bg{transform:scale(1.06);}
.card-overlay{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.2) 60%,transparent 100%);}
.card-text{position:absolute;bottom:0;right:0;width:75%;padding:12px 16px;
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow:hidden;}
.card-name{font-size:clamp(1.1rem,2.4vw,1.8rem);line-height:1;letter-spacing:2px;}
.card-title{font-size:clamp(1.4rem,3.6vw,2.7rem);letter-spacing:1px;line-height:1.1;}
.card-play{position:absolute;top:12px;right:12px;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:4px 14px;color:#fff;
  font-family:'Nunito',sans-serif;font-weight:900;font-size:.65rem;
  letter-spacing:2px;backdrop-filter:blur(6px);
  opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;}
.player-card:hover .card-play{opacity:1;transform:translateY(0);}

.card-ben{border:1.5px solid rgba(255,107,0,0.3);}
.card-ben:hover{box-shadow:0 20px 60px rgba(255,107,0,0.3);border-color:rgba(255,107,0,0.7);}
.card-ben .card-bg{background-image:url('D:/AI CREATED APPS AND SITE BY ANDREW/WORD SPELL/IVY WORD SPELL/ASSETS/for web/IVY-WORD-SPELL_LANDSCAPE.jpg');background-position:center;}
.card-ben .card-name{font-family:'Nunito', sans-serif;color:#FF6B00;text-shadow:0 0 8px rgba(255,107,0,0.9),2px 2px 4px rgba(0,0,0,0.9);}
.card-ben .card-title{font-family:'Bangers', cursive;color:#fff;text-shadow:0 0 6px rgba(255,107,0,0.5),1px 1px 3px rgba(0,0,0,0.8);}
.card-kaia{border:1.5px solid rgba(255,107,0,0.3);}
.card-kaia:hover{box-shadow:0 20px 60px rgba(255,107,0,0.3);border-color:rgba(255,107,0,0.7);}
.card-kaia .card-bg{background-image:url('placeholder');background-position:center;}
.card-kaia .card-name{font-family:'Nunito', sans-serif;color:#FF6B00;text-shadow:0 0 8px rgba(255,107,0,0.9),2px 2px 4px rgba(0,0,0,0.9);}
.card-kaia .card-title{font-family:'Bangers', cursive;color:#fff;text-shadow:0 0 6px rgba(255,107,0,0.5),1px 1px 3px rgba(0,0,0,0.8);}
.card-willow{border:1.5px solid rgba(255,107,0,0.3);}
.card-willow:hover{box-shadow:0 20px 60px rgba(255,107,0,0.3);border-color:rgba(255,107,0,0.7);}
.card-willow .card-bg{background-image:url('placeholder');background-position:center;}
.card-willow .card-name{font-family:'Nunito', sans-serif;color:#FF6B00;text-shadow:0 0 8px rgba(255,107,0,0.9),2px 2px 4px rgba(0,0,0,0.9);}
.card-willow .card-title{font-family:'Bangers', cursive;color:#fff;text-shadow:0 0 6px rgba(255,107,0,0.5),1px 1px 3px rgba(0,0,0,0.8);}

@media(max-width:600px){
  body{justify-content:flex-start;padding-top:42vh;padding-bottom:40px;}
  .grid{grid-template-columns:1fr;gap:14px;margin-top:0;}
  .player-card{aspect-ratio:16/7;}
  .card-text{width:95%;overflow:visible;}
}
</style>
</head>
<body>
<div class="grid">
  <a class="player-card card-ben" href="ben-wordgame.html">
    <div class="card-bg"></div><div class="card-overlay"></div>
    <div class="card-text">
      <div class="card-name">BEN'S</div>
      <div class="card-title">WORD CUP</div>
    </div>
    <div class="card-play">▶ PLAY</div>
  </a>
  <a class="player-card card-kaia" href="kaia-wordgame.html">
    <div class="card-bg"></div><div class="card-overlay"></div>
    <div class="card-text">
      <div class="card-name">KAIA'S</div>
      <div class="card-title">SWIFT SPELLMASTER</div>
    </div>
    <div class="card-play">▶ PLAY</div>
  </a>
  <a class="player-card card-willow" href="willow-wordgame.html">
    <div class="card-bg"></div><div class="card-overlay"></div>
    <div class="card-text">
      <div class="card-name">WILLOW'S</div>
      <div class="card-title">SPELL IT OFF</div>
    </div>
    <div class="card-play">▶ PLAY</div>
  </a>
</div>
</body>
</html>
