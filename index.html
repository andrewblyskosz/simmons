.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:900px;width:100%;margin-top:160px;}
.player-card{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:3/2;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;text-decoration:none;}
.player-card:hover{transform:translateY(-6px) scale(1.02);}
.card-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .4s;}
.player-card:hover .card-bg{transform:scale(1.06);}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.85) 0%,rgba(0,0,0,0.2) 60%,transparent 100%);}
.card-text{position:absolute;bottom:0;right:0;width:75%;padding:12px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;overflow:hidden;}
.card-name{line-height:1;letter-spacing:2px;}
.card-title{letter-spacing:1px;line-height:1.1;}
.card-play{position:absolute;top:12px;right:12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);
  border-radius:20px;padding:4px 14px;color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:.65rem;
